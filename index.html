<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">

  .js-live{display:none;margin-top:14px;font-size:10.5px;letter-spacing:.14em;color:#b9c9d8}
  .diag-line{margin-top:8px;font-size:11.5px;color:#b4664f;letter-spacing:.02em;line-height:1.8}
</style>
<link rel="stylesheet" href="style.css?v=8">

<body>

<noscript>
  <div class="noscript-warn">这个页面的 JavaScript 被关闭了。请在浏览器设置里开启 JavaScript，然后刷新页面。</div>
</noscript>

<div class="snow-bg" aria-hidden="true">
  <div class="snow-photo"></div>
  <div class="snowflakes" id="snowflakes"></div>
</div>

<div id="lockScreen" class="screen lock">
  <div class="lock-inner">
    <div class="caps">HOKKAIDO · WINTER JOURNEY</div>
    <h1 class="lock-title">北海道<i>×</i>猪猪饲料</h1>
    <p class="lock-sub">私人旅行手账 · 请输入密码</p>
    <form id="lockForm" class="lock-form" autocomplete="off">
      <input id="lockInput" type="password" placeholder="密码" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
      <button type="submit">进入雪国 <span>→</span></button>
    </form>
    <p id="lockErr" class="lock-err"></p>
    <p id="diagLine" class="diag-line"></p>
    <p class="lock-foot">2027.01.30 — 02.04<br>札幌 · 旭川 · 美瑛 · 小樽 · 定山溪</p>
    <div id="jsLive" class="js-live">✓ 脚本已加载 v8</div>
  </div>
</div>

<div id="homeScreen" class="screen hidden"></div>

<div id="appScreen" class="screen hidden">
  <header class="app-header">
    <div class="header-title" id="homeLink" role="button" tabindex="0">
      <div class="title-row">
        <span id="tripTitle">北海道 × 猪猪饲料</span>
        <span class="sync-badge" id="syncBadge"></span>
      </div>
      <span class="header-date" id="tripDate"></span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="btnLock" type="button" title="锁屏">🔒</button>
      <button class="btn-share" id="btnShare" type="button">分享</button>
    </div>
  </header>
  <main id="main"></main>
</div>

<nav id="bottomNav" class="bottom-nav hidden">
  <button class="nav-item" data-tab="home" type="button"><span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M4.2 10.9 12 4.5l7.8 6.4"/><path d="M6.5 9.9V19h11V9.9"/><path d="M10.2 19v-4.5h3.6V19"/><circle cx="12" cy="3.2" r=".85" class="dot"/></svg></span><span class="nav-label">首页</span></button>
  <button class="nav-item" data-tab="itinerary" type="button"><span class="nav-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.1"/><path d="M14.9 9.1l-1.75 3.95-3.95 1.75 1.75-3.95z"/><circle cx="12" cy="12" r=".8" class="dot"/></svg></span><span class="nav-label">行程</span></button>
  <button class="nav-item" data-tab="map" type="button"><span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M9 4.7 3.9 6.7v12.5L9 17.2l6 2 5.1-2V4.7l-5.1 2z"/><path d="M9 4.7v12.5M15 6.7v12.5"/></svg></span><span class="nav-label">地图</span></button>
  <button class="nav-item" data-tab="reminder" type="button"><span class="nav-ico"><svg viewBox="0 0 24 24"><rect x="4.4" y="4.2" width="15.2" height="15.6" rx="4.2"/><path d="M8.4 12.1l2.35 2.35 4.75-4.95"/></svg></span><span class="nav-label">清单</span></button>
  <button class="nav-item" data-tab="expense" type="button"><span class="nav-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.1"/><path d="M9.3 8.7 12 12.3l2.7-3.6M12 12.3v4.3M9.8 13.4h4.4M9.8 15.4h4.4"/></svg></span><span class="nav-label">记账</span></button>

<div id="bootWarn" style="display:none;position:fixed;left:14px;right:14px;bottom:14px;z-index:300;background:#fff5f5;border:1px solid #f2caca;color:#8a4b4b;padding:12px 14px;border-radius:12px;font-size:12.5px;line-height:1.7;">
  页面脚本没有加载成功。请确认 config.js / data.js / store.js / app.js 和 index.html 在同一个文件夹，然后刷新。
</div>

<div id="modalRoot"></div>
<div id="toast"></div>

<script src="config.js?v=8"></script>
<script src="data.js?v=8"></script>
<script src="store.js?v=8"></script>
<script src="app.js?v=8"></script>
<script>
(function(){
  var q = function(id){ return document.getElementById(id); };
  var live = q("jsLive");
  if (live) live.style.display = "inline-block";
  window.addEventListener("error", function(e){
    var d = q("diagLine");
    if (d && !d.textContent) d.textContent = "脚本错误：" + (e && e.message ? e.message : "未知");
  });
  function check(ev){
    var i = q("lockInput"); var err = q("lockErr"); var d = q("diagLine");
    var v = (i && i.value ? i.value : "").trim().toLowerCase();
    if (!v) return;
    if (v !== "lu123321"){
      if (ev && ev.preventDefault) ev.preventDefault();
      if (err) err.textContent = "密码不对，再试一次";
      return;
    }
    if (window.__gateBound) return;
    if (ev && ev.preventDefault) ev.preventDefault();
    if (err) err.textContent = "密码正确，但页面脚本没有启动";
    if (d) d.textContent = "诊断：APP_CONFIG=" + (window.APP_CONFIG ? "已加载" : "缺失") + " · Store=" + (window.Store ? "已加载" : "缺失") + " · app.js=" + (window.__appReady ? "已运行" : "未运行");
  }
  document.addEventListener("submit", function(e){ if (e.target && e.target.id === "lockForm") check(e); }, true);
  document.addEventListener("click", function(e){ var b = e.target && e.target.closest ? e.target.closest("#lockForm button") : null; if (b) check(e); }, true);
})();
</script>
<script>
  window.addEventListener("load", function(){
    setTimeout(function(){
      if (!window.__appReady){ var el = document.getElementById("bootWarn"); if (el) el.style.display = "block"; }
    }, 2500);
  });
</script>
</body>
</html>
